<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Frame Test</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #001122">
    <a-sphere position="0 1.6 -3" radius="1" color="#EF2D5E"></a-sphere>
    <a-box position="-2 1 -3" color="#4CC3D9"></a-box>
    <a-cylinder position="2 1 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
    <a-sky color="#001122"></a-sky>
  </a-scene>
</body
  
</html>
