<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Explorer VR | Solar System</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; }
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(10,20,40,0.95); border-bottom: 2px solid #4fc3f7;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; z-index: 1000; flex-wrap: wrap; gap: 8px;
    }
    #header .logo { color: #4fc3f7; font-weight: bold; font-size: 15px; letter-spacing: 1px; }
    #header .btns { display: flex; gap: 5px; flex-wrap: wrap; }
    #header button {
      background: #1c3a5e; color: #fff; border: 1px solid #4fc3f7;
      border-radius: 6px; padding: 6px 10px; font-size: 11px; cursor: pointer;
    }
    #header button.active { background: #ffca28; color: #001a33; font-weight: bold; }
    #speed {
      position: fixed; top: 58px; right: 14px; z-index: 1000;
      background: rgba(10,20,40,0.9); border: 1px solid #4fc3f7; border-radius: 8px;
      padding: 8px 12px; color: #fff; font-size: 12px;
    }
    #speed button {
      background: #1c3a5e; color: #4fc3f7; border: 1px solid #4fc3f7;
      border-radius: 5px; padding: 3px 8px; margin: 0 3px; cursor: pointer; font-weight: bold;
    }
    #info {
      position: fixed; bottom: 14px; left: 14px; z-index: 1000; max-width: 340px;
      background: rgba(10,20,40,0.92); border: 1px solid #4fc3f7; border-radius: 10px;
      padding: 14px; color: #cfd8dc;
    }
    #info h3 { color: #4fc3f7; font-size: 15px; margin-bottom: 6px; }
    #info p { font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>

<div id="header">
  <div class="logo">🚀 SPACE EXPLORER VR</div>
  <div class="btns">
    <button class="active" onclick="setLesson(0)">Solar System</button>
    <button onclick="setLesson(1)">1. Orbits</button>
    <button onclick="setLesson(2)">2. Day &amp; Night</button>
    <button onclick="setLesson(3)">3. Seasons</button>
    <button onclick="setLesson(4)">4. Phases</button>
    <button onclick="setLesson(5)">5. Tides</button>
    <button onclick="setLesson(6)">6. Eclipses</button>
  </div>
</div>

<div id="speed">
  Speed: <button onclick="changeSpeed(-0.3)">−</button><span id="speedNum">1.0x</span><button onclick="changeSpeed(0.3)">+</button>
</div>

<div id="info">
  <h3 id="title">The Solar System</h3>
  <p id="desc">8 planets and their moons orbit the Sun. Point at a planet and click (or pull the trigger in VR) to learn about it. Left stick to fly.</p>
</div>

<a-scene background="color: #000010">

  <!-- Camera rig with movement + controllers -->
  <a-entity id="rig" position="0 2 11" movement-controls="speed: 0.3; fly: true">
    <a-entity camera position="0 1.6 0" look-controls>
      <a-cursor color="#4fc3f7" raycaster="objects: .clickable"></a-cursor>
    </a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 40"></a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 40"></a-entity>

    <!-- VR menu board (follows the user) -->
    <a-entity position="-2.4 1.2 -3" rotation="0 30 0" scale="0.4 0.4 0.4">
      <a-plane width="5" height="7" color="#0a1428" opacity="0.9"></a-plane>
      <a-text value="LESSON MENU" color="#4fc3f7" align="center" position="0 3 0" width="8"></a-text>
      <a-entity id="vrMenuBtns"></a-entity>
    </a-entity>

    <!-- VR info board (follows the user) -->
    <a-entity position="2.4 1.2 -3" rotation="0 -30 0" scale="0.4 0.4 0.4">
      <a-plane width="6.5" height="4.5" color="#0a1428" opacity="0.9"></a-plane>
      <a-text id="vrTitle" value="THE SOLAR SYSTEM" color="#4fc3f7" align="center" position="0 1.7 0" width="8"></a-text>
      <a-text id="vrDesc" value="Point at a planet and pull the trigger to learn about it." color="#e0e0e0" align="center" position="0 -0.2 0" width="5.5" wrap-count="34"></a-text>
    </a-entity>
  </a-entity>

  <!-- Lights -->
  <a-entity light="type: ambient; intensity: 0.6"></a-entity>
  <a-entity light="type: point; intensity: 1.5; distance: 100" position="0 3 0"></a-entity>

  <!-- Stars -->
  <a-entity id="stars"></a-entity>

  <!-- Solar system -->
  <a-entity id="solar" position="0 3 0">

    <!-- SUN -->
    <a-sphere class="clickable" data-name="The Sun"
      data-info="A giant ball of hot gas holding 99.8% of all mass in the solar system. 1.3 million Earths could fit inside!"
      radius="2.6" color="#FFA500" material="emissive: #FF8800; emissiveIntensity: 0.9"></a-sphere>

    <!-- MERCURY -->
    <a-entity class="orbit" data-speed="4.1">
      <a-sphere class="clickable" position="4.2 0 0" radius="0.11" color="#8B7355"
        data-name="Mercury" data-info="Smallest planet, closest to the Sun. 430C by day, -180C at night."></a-sphere>
    </a-entity>
    <a-ring radius-inner="4.19" radius-outer="4.21" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.25; side: double"></a-ring>

    <!-- VENUS -->
    <a-entity class="orbit" data-speed="1.6">
      <a-sphere position="5.6 0 0" radius="0.22" color="#FFC649" class="clickable"
        data-name="Venus" data-info="Hottest planet at 465C. Wrapped in thick clouds of sulfuric acid."></a-sphere>
    </a-entity>
    <a-ring radius-inner="5.59" radius-outer="5.61" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.25; side: double"></a-ring>

    <!-- EARTH + MOON -->
    <a-entity class="orbit" data-speed="1">
      <a-entity position="7.2 0 0">
        <a-sphere class="clickable" radius="0.24" color="#1E90FF"
          data-name="Earth" data-info="Our home - the only planet known to have life. 71% is covered in water."></a-sphere>
        <a-entity class="orbit" data-speed="6">
          <a-sphere position="0.6 0 0" radius="0.07" color="#C0C0C0" class="clickable"
            data-name="The Moon" data-info="Earth's only natural satellite. It causes our ocean tides."></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>
    <a-ring radius-inner="7.19" radius-outer="7.21" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.3; side: double"></a-ring>

    <!-- MARS + 2 MOONS -->
    <a-entity class="orbit" data-speed="0.53">
      <a-entity position="8.9 0 0">
        <a-sphere class="clickable" radius="0.16" color="#C1440E"
          data-name="Mars" data-info="The Red Planet. Rusty iron dust covers it. Home to the tallest volcano in the solar system."></a-sphere>
        <a-entity class="orbit" data-speed="9"><a-sphere position="0.32 0 0" radius="0.03" color="#9e9e9e" class="clickable" data-name="Phobos" data-info="Phobos is the larger of Mars's two small moons."></a-sphere></a-entity>
        <a-entity class="orbit" data-speed="6"><a-sphere position="0.45 0 0" radius="0.025" color="#b0b0b0" class="clickable" data-name="Deimos" data-info="Deimos is the smaller, outer moon of Mars."></a-sphere></a-entity>
      </a-entity>
    </a-entity>
    <a-ring radius-inner="8.89" radius-outer="8.91" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.25; side: double"></a-ring>

    <!-- JUPITER + 4 MOONS -->
    <a-entity class="orbit" data-speed="0.084">
      <a-entity position="11.5 0 0">
        <a-sphere class="clickable" radius="0.9" color="#D9A066"
          data-name="Jupiter" data-info="The largest planet - 1,300 Earths could fit inside! Its Great Red Spot is a storm bigger than Earth."></a-sphere>
        <a-entity class="orbit" data-speed="7"><a-sphere position="1.2 0 0" radius="0.06" color="#e8d16a" class="clickable" data-name="Io" data-info="Io is the most volcanically active body in the solar system."></a-sphere></a-entity>
        <a-entity class="orbit" data-speed="5"><a-sphere position="1.45 0 0" radius="0.055" color="#cfc0a8" class="clickable" data-name="Europa" data-info="Europa may have a liquid water ocean under its icy crust."></a-sphere></a-entity>
        <a-entity class="orbit" data-speed="3.5"><a-sphere position="1.75 0 0" radius="0.08" color="#9a8b78" class="clickable" data-name="Ganymede" data-info="Ganymede is the largest moon in the solar system - bigger than Mercury!"></a-sphere></a-entity>
        <a-entity class="orbit" data-speed="2.5"><a-sphere position="2.05 0 0" radius="0.07" color="#7a6f60" class="clickable" data-name="Callisto" data-info="Callisto is one of the most heavily cratered objects in the solar system."></a-sphere></a-entity>
      </a-entity>
    </a-entity>
    <a-ring radius-inner="11.49" radius-outer="11.51" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.25; side: double"></a-ring>

    <!-- SATURN + RINGS + 2 MOONS -->
    <a-entity class="orbit" data-speed="0.034">
      <a-entity position="14.5 0 0">
        <a-sphere class="clickable" radius="0.75" color="#E3C16F"
          data-name="Saturn" data-info="Famous for its stunning rings of ice and rock. It has 80+ moons!"></a-sphere>
        <a-ring radius-inner="0.95" radius-outer="1.5" rotation="75 0 0" color="#F4E4A8" material="opacity: 0.7; side: double"></a-ring>
        <a-entity class="orbit" data-speed="4"><a-sphere position="1.6 0 0" radius="0.075" color="#c9a15a" class="clickable" data-name="Titan" data-info="Titan has a thick atmosphere and rivers of liquid methane."></a-sphere></a-entity>
        <a-entity class="orbit" data-speed="2.8"><a-sphere position="1.95 0 0" radius="0.045" color="#b8b8b8" class="clickable" data-name="Rhea" data-info="Rhea is Saturn's second-largest moon, made mostly of ice."></a-sphere></a-entity>
      </a-entity>
    </a-entity>
    <a-ring radius-inner="14.49" radius-outer="14.51" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.25; side: double"></a-ring>

    <!-- URANUS + 2 MOONS -->
    <a-entity class="orbit" data-speed="0.012">
      <a-entity position="17.2 0 0">
        <a-sphere class="clickable" radius="0.42" color="#7DE3E1"
          data-name="Uranus" data-info="An ice giant that spins on its side - tilted 98 degrees!"></a-sphere>
        <a-entity class="orbit" data-speed="4"><a-sphere position="0.8 0 0" radius="0.04" color="#a8c4c3" class="clickable" data-name="Titania" data-info="Titania is the largest moon of Uranus."></a-sphere></a-entity>
        <a-entity class="orbit" data-speed="3"><a-sphere position="1.0 0 0" radius="0.038" color="#98b0af" class="clickable" data-name="Oberon" data-info="Oberon is the outermost large moon of Uranus."></a-sphere></a-entity>
      </a-entity>
    </a-entity>
    <a-ring radius-inner="17.19" radius-outer="17.21" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.25; side: double"></a-ring>

    <!-- NEPTUNE + 1 MOON -->
    <a-entity class="orbit" data-speed="0.006">
      <a-entity position="19.5 0 0">
        <a-sphere class="clickable" radius="0.4" color="#3D5AFE"
          data-name="Neptune" data-info="The windiest planet - winds top 2,100 km/h! One orbit takes 165 Earth years."></a-sphere>
        <a-entity class="orbit" data-speed="4"><a-sphere position="0.85 0 0" radius="0.05" color="#8a9bd4" class="clickable" data-name="Triton" data-info="Triton orbits Neptune backwards and has geysers of nitrogen."></a-sphere></a-entity>
      </a-entity>
    </a-entity>
    <a-ring radius-inner="19.49" radius-outer="19.51" rotation="-90 0 0" color="#4fc3f7" material="opacity: 0.25; side: double"></a-ring>

  </a-entity>

  <a-sky color="#000010"></a-sky>

</a-scene>

<script>
  // ---- Lesson content ----
  var lessons = [
    { t:'THE SOLAR SYSTEM', d:'8 planets and their moons orbit the Sun. Point at a planet and click (or pull the trigger in VR) to learn about it. Left stick to fly.' },
    { t:'LESSON 1: ORBITS', d:'Planets closer to the Sun orbit faster. Mercury takes 88 days; Neptune takes 165 years.' },
    { t:'LESSON 2: DAY & NIGHT', d:'As Earth spins, one side faces the Sun (day) and the other is dark (night). One spin = 24 hours.' },
    { t:'LESSON 3: SEASONS', d:'Earth is tilted 23.5 degrees. As it orbits, each half leans toward or away from the Sun, giving us seasons.' },
    { t:'LESSON 4: MOON PHASES', d:'As the Moon circles Earth every 29.5 days, we see different amounts of its sunlit half.' },
    { t:'LESSON 5: TIDES', d:'The Moon\'s gravity pulls Earth\'s oceans into bulges - these are the high tides, twice a day.' },
    { t:'LESSON 6: ECLIPSES', d:'A solar eclipse: the Moon blocks the Sun. A lunar eclipse: Earth\'s shadow falls on the Moon.' }
  ];

  var speed = 1;

  function setLesson(n) {
    var l = lessons[n];
    document.getElementById('title').textContent = l.t;
    document.getElementById('desc').textContent = l.d;
    var btns = document.querySelectorAll('#header button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', i === n);
    var vt = document.getElementById('vrTitle'); if (vt) vt.setAttribute('value', l.t);
    var vd = document.getElementById('vrDesc'); if (vd) vd.setAttribute('value', l.d);
  }

  function changeSpeed(d) {
    speed = Math.max(0.1, Math.min(3, Math.round((speed + d) * 10) / 10));
    document.getElementById('speedNum').textContent = speed.toFixed(1) + 'x';
  }

  // ---- Build VR menu buttons + stars, and wire everything after scene loads ----
  window.addEventListener('load', function () {
    var scene = document.querySelector('a-scene');

    function ready() {
      // Stars
      var stars = document.querySelector('#stars');
      for (var i = 0; i < 250; i++) {
        var s = document.createElement('a-sphere');
        var x = (Math.random()-0.5)*140, y = (Math.random()-0.5)*140, z = (Math.random()-0.5)*140;
        s.setAttribute('position', x.toFixed(1)+' '+y.toFixed(1)+' '+z.toFixed(1));
        s.setAttribute('radius', (Math.random()*0.1+0.03).toFixed(2));
        s.setAttribute('color', '#ffffff');
        stars.appendChild(s);
      }

      // VR menu buttons
      var box = document.querySelector('#vrMenuBtns');
      for (var j = 0; j < lessons.length; j++) {
        (function (idx) {
          var y = 2.2 - idx * 0.75;
          var b = document.createElement('a-plane');
          b.setAttribute('class', 'clickable');
          b.setAttribute('width', 4.2);
          b.setAttribute('height', 0.6);
          b.setAttribute('position', '0 ' + y + ' 0.01');
          b.setAttribute('color', idx === 0 ? '#ffca28' : '#1c3a5e');
          b.dataset.lesson = idx;
          var t = document.createElement('a-text');
          t.setAttribute('value', lessons[idx].t.replace('LESSON ','').replace('THE ',''));
          t.setAttribute('color', idx === 0 ? '#001a33' : '#fff');
          t.setAttribute('align', 'center');
          t.setAttribute('width', 5);
          t.setAttribute('position', '0 0 0.01');
          b.appendChild(t);
          box.appendChild(b);
        })(j);
      }

      // Click handling for planets + menu
      scene.addEventListener('click', function (e) {
        var el = e.target;
        if (!el.dataset) return;
        if (el.dataset.lesson !== undefined) {
          setLesson(parseInt(el.dataset.lesson));
          // recolor menu
          var mbtns = box.querySelectorAll('a-plane');
          for (var k = 0; k < mbtns.length; k++) {
            var on = parseInt(mbtns[k].dataset.lesson) === parseInt(el.dataset.lesson);
            mbtns[k].setAttribute('color', on ? '#ffca28' : '#1c3a5e');
            var txt = mbtns[k].querySelector('a-text');
            if (txt) txt.setAttribute('color', on ? '#001a33' : '#fff');
          }
        } else if (el.dataset.name) {
          document.getElementById('title').textContent = el.dataset.name;
          document.getElementById('desc').textContent = el.dataset.info;
          var vt = document.getElementById('vrTitle'); if (vt) vt.setAttribute('value', el.dataset.name.toUpperCase());
          var vd = document.getElementById('vrDesc'); if (vd) vd.setAttribute('value', el.dataset.info);
        }
      });

      // Animate orbits + spins using A-Frame's tick (works in VR too)
      AFRAME.registerComponent('spinner', {
        tick: function (time, dt) {
          if (!dt) return;
          var step = Math.min(dt, 100) / 16.67;
          var orbits = document.querySelectorAll('.orbit');
          for (var i = 0; i < orbits.length; i++) {
            var sp = parseFloat(orbits[i].dataset.speed) || 0;
            var a = (parseFloat(orbits[i].dataset.angle) || 0) + sp * 0.35 * speed * step;
            orbits[i].dataset.angle = a;
            orbits[i].object3D.rotation.y = a * Math.PI / 180;
          }
        }
      });
      scene.setAttribute('spinner', '');
    }

    if (scene.hasLoaded) ready();
    else scene.addEventListener('loaded', ready);
  });
</script>

</body>
</html>
